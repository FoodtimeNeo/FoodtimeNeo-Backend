spring:
  application:
    name: foodtime-neo-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # Also works for java -jar; an absent .env is allowed.
  config:
    import: optional:file:./.env[.properties]
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: FoodTimeHikariPool
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: foodtime
    schemas: foodtime
    create-schemas: true
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
  sql:
    init:
      mode: never
  data:
    redis:
      client-type: lettuce
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:3s}
      timeout: ${REDIS_TIMEOUT:3s}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      lettuce:
        pool:
          enabled: true
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: 8
          min-idle: 0
          max-wait: 2s
        shutdown-timeout: 200ms
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:20MB}
  mvc:
    problemdetails:
      enabled: false

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Enable framework only when a trusted reverse proxy controls forwarded headers.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  tomcat:
    connection-timeout: 20s
    max-http-form-post-size: 2MB
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: 10

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 10
  global-config:
    banner: false
    db-config:
      # PostgreSQL UUID: use java.util.UUID generated by the service layer.
      id-type: input

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
  info:
    env:
      enabled: true

info:
  app:
    name: FoodTimeNeo Backend

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    persist-authorization: false
  paths-to-match: /api/**

app:
  rating-summary:
    refresh-enabled: ${RATING_SUMMARY_REFRESH_ENABLED:true}
    refresh-interval: ${RATING_SUMMARY_REFRESH_INTERVAL:PT24H}
    initial-delay: ${RATING_SUMMARY_INITIAL_DELAY:PT0S}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Content-Type,Authorization,X-Request-Id
    exposed-headers: X-Request-Id
    max-age: 3600s

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.FoodtimeNeo: ${APP_LOG_LEVEL:INFO}
  file:
    name: ${LOG_FILE:logs/foodtime-neo-backend.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
  pattern:
    level: '%5p [requestId:%X{requestId:-}]'
