spring:
  application:
    name: foodtime-neo-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # Also works for java -jar; an absent .env is allowed.
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./config/mail.yml
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${MAIL_STARTTLS_ENABLED:true}
      "[mail.smtp.starttls.required]": ${MAIL_STARTTLS_REQUIRED:true}
      "[mail.smtp.ssl.enable]": ${MAIL_SSL_ENABLED:false}
      "[mail.smtp.ssl.checkserveridentity]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  lifecycle:
    timeout-per-shutdown-phase: 30s
  session:
    timeout: 15m
    data:
      redis:
        # Spring Boot 4：原 spring.session.redis.* 已废弃，必须走 data.redis
        namespace: ${SESSION_REDIS_NAMESPACE:spring:session}
        repository-type: default
        flush-mode: immediate
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: FoodTimeHikariPool
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: foodtime
    schemas: foodtime
    create-schemas: true
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
  sql:
    init:
      mode: never
  data:
    redis:
      client-type: lettuce
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:3s}
      timeout: ${REDIS_TIMEOUT:3s}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      lettuce:
        pool:
          enabled: true
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: 8
          min-idle: 0
          max-wait: 2s
        shutdown-timeout: 200ms
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:20MB}
  mvc:
    problemdetails:
      enabled: false

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Enable framework only when a trusted reverse proxy controls forwarded headers.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  tomcat:
    connection-timeout: 20s
    max-http-form-post-size: 2MB
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: 10

mybatis-plus:
  type-handlers-package: com.FoodtimeNeo.common.mybatis
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 10
  global-config:
    banner: false
    db-config:
      # PostgreSQL UUID: use java.util.UUID generated by the service layer.
      id-type: input

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
  info:
    env:
      enabled: true

info:
  app:
    name: FoodTimeNeo Backend

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    persist-authorization: false
  paths-to-match: /api/**

app:
  # Tomcat's max-http-form-post-size only guards form posts; JSON bodies need their own cap.
  request:
    max-json-bytes: ${REQUEST_MAX_JSON_BYTES:1048576}
    max-multipart-bytes: ${REQUEST_MAX_MULTIPART_BYTES:20971520}
  ai:
    triage:
      enabled: ${AI_TRIAGE_ENABLED:false}
      provider: ${AI_TRIAGE_PROVIDER:openai}
      base-url: ${AI_TRIAGE_BASE_URL:}
      api-key: ${AI_TRIAGE_API_KEY:}
      primary-model: ${AI_TRIAGE_PRIMARY_MODEL:nvidia/nemotron-3-super-120b-a12b}
      escalation-model: ${AI_TRIAGE_ESCALATION_MODEL:nvidia/nemotron-3.5-super-vl-120b-a12b}
      fallback-model: ${AI_TRIAGE_FALLBACK_MODEL:z-ai/glm-5.3-flash}
      escalation-below-confidence: ${AI_TRIAGE_ESCALATION_BELOW_CONFIDENCE:0.9}
      photo-model: ${AI_TRIAGE_PHOTO_MODEL:nvidia/nemotron-3.5-super-vl-120b-a12b}
      auto-approve-above: ${AI_TRIAGE_AUTO_APPROVE_ABOVE:0.95}
      community-approve-above: ${AI_TRIAGE_COMMUNITY_APPROVE_ABOVE:0.85}
      auto-reject-above: ${AI_TRIAGE_AUTO_REJECT_ABOVE:0.9}
      redis-namespace: ${AI_TRIAGE_REDIS_NAMESPACE:foodtime:ai:triage}
      timeout: ${AI_TRIAGE_TIMEOUT:PT30S}
      batch-size: ${AI_TRIAGE_BATCH_SIZE:10}
      interval: ${AI_TRIAGE_INTERVAL:PT30S}
      initial-delay: ${AI_TRIAGE_INITIAL_DELAY:PT5S}
      pool-core: ${AI_TRIAGE_POOL_CORE:4}
      pool-max: ${AI_TRIAGE_POOL_MAX:8}
      pool-queue: ${AI_TRIAGE_POOL_QUEUE:500}
    single:
      enabled: ${AI_SINGLE_ENABLED:false}
      base-url: ${AI_SINGLE_BASE_URL:}
      api-key: ${AI_SINGLE_API_KEY:}
      model: ${AI_SINGLE_MODEL:}
      timeout: ${AI_SINGLE_TIMEOUT:PT30S}
  invitation:
    secret: ${INVITATION_SECRET:}
  email-verification:
    enabled: ${EMAIL_VERIFICATION_ENABLED:false}
    from: ${MAIL_FROM:}
    secret: ${EMAIL_VERIFICATION_SECRET:}
    redis-namespace: ${EMAIL_VERIFICATION_NAMESPACE:foodtime:auth:email}
    resend-interval: ${EMAIL_RESEND_INTERVAL:PT60S}
    send-window: ${EMAIL_SEND_WINDOW:PT15M}
    send-account-limit: ${EMAIL_SEND_ACCOUNT_LIMIT:5}
    send-device-limit: ${EMAIL_SEND_DEVICE_LIMIT:5}
    send-ip-limit: ${EMAIL_SEND_IP_LIMIT:200}
    mailbox:
      enabled: ${EMAIL_MAILBOX_VERIFY_ENABLED:false}
      host: ${EMAIL_MAILBOX_VERIFY_HOST:smg.bjtu.edu.cn}
      port: ${EMAIL_MAILBOX_VERIFY_PORT:465}
      timeout: ${EMAIL_MAILBOX_VERIFY_TIMEOUT:PT3S}
      cache-ttl: ${EMAIL_MAILBOX_VERIFY_CACHE_TTL:PT10M}
      cache-namespace: ${EMAIL_MAILBOX_VERIFY_CACHE_NAMESPACE:foodtime:auth:mailbox}
  auth:
    session-ttl: ${AUTH_SESSION_TTL:P7D}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    login-window: ${AUTH_LOGIN_WINDOW:PT15M}
    login-account-limit: ${AUTH_LOGIN_ACCOUNT_LIMIT:10}
    login-ip-limit: ${AUTH_LOGIN_IP_LIMIT:1000}
    redis-namespace: ${AUTH_REDIS_NAMESPACE:foodtime:auth:login}
    registration:
      # open | invitation | closed. closed also stops verification-code sending.
      mode: ${REGISTRATION_MODE:open}
      window: ${REGISTRATION_WINDOW:PT15M}
      account-limit: ${REGISTRATION_ACCOUNT_LIMIT:10}
      device-limit: ${REGISTRATION_DEVICE_LIMIT:10}
      ip-limit: ${REGISTRATION_IP_LIMIT:1000}
      redis-namespace: ${REGISTRATION_REDIS_NAMESPACE:foodtime:auth:registration}
    client-header:
      # off | observe | enforce. Official clients send the header; observe only logs unknowns.
      mode: ${CLIENT_HEADER_MODE:observe}
      header-name: ${CLIENT_HEADER_NAME:X-Foodtime-Client}
      allowed-clients: ${CLIENT_HEADER_ALLOWED:web,android}
      paths: ${CLIENT_HEADER_PATHS:/api/v1/auth/register,/api/v1/auth/register/email-code}
    device:
      # 默认复用邮箱验证密钥；也可用 AUTH_DEVICE_SECRET 单独设置。更换会使旧设备 Cookie 失效。
      secret: ${AUTH_DEVICE_SECRET:${EMAIL_VERIFICATION_SECRET:}}
      cookie-name: ${AUTH_DEVICE_COOKIE_NAME:foodtime_device}
      max-age: ${AUTH_DEVICE_COOKIE_MAX_AGE:P365D}
    password-change:
      window: ${PASSWORD_CHANGE_WINDOW:PT15M}
      user-limit: ${PASSWORD_CHANGE_USER_LIMIT:5}
      ip-limit: ${PASSWORD_CHANGE_IP_LIMIT:500}
      redis-namespace: ${PASSWORD_CHANGE_REDIS_NAMESPACE:foodtime:auth:password-change}
  protection:
    # 全局在途请求上限；按 2 vCPU / 1GB 堆 / Tomcat 200 线程留出余量。
    enabled: ${PROTECTION_ENABLED:true}
    global-max-concurrency: ${PROTECTION_GLOBAL_MAX_CONCURRENCY:100}
    # 发码会访问学校 SMTP 与 163，注册/登录会跑 Argon2；单独压低并发。
    email-code-max-concurrency: ${PROTECTION_EMAIL_CODE_MAX_CONCURRENCY:30}
    registration-max-concurrency: ${PROTECTION_REGISTRATION_MAX_CONCURRENCY:12}
    login-max-concurrency: ${PROTECTION_LOGIN_MAX_CONCURRENCY:12}
    retry-after-seconds: ${PROTECTION_RETRY_AFTER_SECONDS:2}
  content:
    submissions:
      window: ${SUBMISSION_WINDOW:PT15M}
      user-limit: ${SUBMISSION_USER_LIMIT:20}
      ip-limit: ${SUBMISSION_IP_LIMIT:2000}
      redis-namespace: ${SUBMISSION_REDIS_NAMESPACE:foodtime:content:submissions}
    uploads:
      window: ${UPLOAD_WINDOW:PT1H}
      user-limit: ${UPLOAD_USER_LIMIT:10}
      ip-limit: ${UPLOAD_IP_LIMIT:1000}
      redis-namespace: ${UPLOAD_REDIS_NAMESPACE:foodtime:content:uploads}
  review:
    actions:
      window: ${REVIEW_ACTION_WINDOW:PT1M}
      user-limit: ${REVIEW_ACTION_USER_LIMIT:100}
      ip-limit: ${REVIEW_ACTION_IP_LIMIT:1000}
      redis-namespace: ${REVIEW_ACTION_REDIS_NAMESPACE:foodtime:review:actions}
  community:
    actions:
      window: ${COMMUNITY_ACTION_WINDOW:PT1M}
      user-limit: ${COMMUNITY_ACTION_USER_LIMIT:100}
      ip-limit: ${COMMUNITY_ACTION_IP_LIMIT:1000}
      redis-namespace: ${COMMUNITY_ACTION_REDIS_NAMESPACE:foodtime:community:actions}
  storage:
    quota:
      user-bytes: ${STORAGE_USER_BYTES:104857600}
      total-bytes: ${STORAGE_TOTAL_BYTES:10737418240}
      min-free-bytes: ${STORAGE_MIN_FREE_BYTES:1073741824}
      concurrent-uploads: ${STORAGE_CONCURRENT_UPLOADS:2}
    cleanup-enabled: ${STORAGE_CLEANUP_ENABLED:true}
    cleanup-interval: ${STORAGE_CLEANUP_INTERVAL:PT24H}
    cleanup-initial-delay: ${STORAGE_CLEANUP_INITIAL_DELAY:PT5M}
    cleanup-max-age: ${STORAGE_CLEANUP_MAX_AGE:P7D}
    disk-warn-bytes: ${STORAGE_DISK_WARN_BYTES:1073741824}
  monitoring:
    scrape-ip: ${MONITORING_SCRAPE_IP:127.0.0.1}
    slow-request-threshold: ${SLOW_REQUEST_THRESHOLD:PT2S}
  dashboard:
    presence-namespace: ${DASHBOARD_PRESENCE_NAMESPACE:foodtime:presence}
    presence-ttl: ${DASHBOARD_PRESENCE_TTL:PT5M}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Content-Type,Authorization,X-Request-Id,X-CSRF-TOKEN
    exposed-headers: X-Request-Id
    max-age: 3600s

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.FoodtimeNeo: ${APP_LOG_LEVEL:INFO}
  file:
    name: ${LOG_FILE:logs/foodtime-neo-backend.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
  pattern:
    level: '%5p [requestId:%X{requestId:-}]'
