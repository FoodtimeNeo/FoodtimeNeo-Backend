spring:
  datasource:
    # URL must include currentSchema=foodtime; configure TLS for remote databases.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD}

app:
  test-verification:
    # ProductionConfigurationValidator rejects an explicit true value.
    enabled: ${TEST_VERIFICATION_ENABLED:false}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
