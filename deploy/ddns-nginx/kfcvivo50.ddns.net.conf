# FoodtimeNeo DDNS TLS 入口：kfcvivo50.ddns.net
#
# 安装（Debian）：
#   sudo cp kfcvivo50.ddns.net.conf /etc/nginx/sites-available/kfcvivo50.ddns.net.conf
#   sudo ln -s /etc/nginx/sites-available/kfcvivo50.ddns.net.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 证书（DDNS 解析到本机公网 IP，且路由器/光猫已放行 80+443 到本机）：
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d kfcvivo50.ddns.net
# certbot 会自动写入 ssl_certificate 两行并补 80 跳转；下面 443 段供核对。
# 若 80 被运营商封锁，改用 DNS-01（需 DDNS 服务商 API，见 docs/ddns-tls.md）。

# 80：只做两件事——Let’s Encrypt 验证 + 跳 https，不代理业务。
server {
    listen 80;
    server_name kfcvivo50.ddns.net;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# 443：唯一业务入口，反代本机后端（compose.prod.yml 只绑了 127.0.0.1:8080）。
server {
    listen 443 ssl;
    server_name kfcvivo50.ddns.net;

    ssl_certificate     /etc/letsencrypt/live/kfcvivo50.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kfcvivo50.ddns.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 安全头（后端默认不下发这些，统一由入口加；审计 K11 在此闭环）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # 后端上传上限 10MB，留 multipart 余量
    client_max_body_size 12m;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # 只传 TCP 对端真实 IP，丢弃客户端自带的 X-Forwarded-For（防伪造）；
        # 后端 FORWARD_HEADERS_STRATEGY=framework 已配好，直接还原客户端 IP。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    # 前端页面（如与后端同机部署：把 Web dist 解到 /var/www/foodtime-web 后取消注释，
    # 同源则浏览器不再有跨域，后端 CORS 不用动）
    # location / {
    #     root /var/www/foodtime-web;
    #     index index.html;
    #     try_files $uri $uri/ /index.html;
    # }
}
