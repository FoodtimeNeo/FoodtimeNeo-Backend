# Copy to config/mail.yml, fill real SMTP settings, then set enabled to true.
# config/mail.yml is excluded from Git and Docker build contexts.
# Defaults use SMTP STARTTLS on 587. For implicit TLS on 465, use the alternatives below.
spring:
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:sender@example.com}
    # Typically an SMTP authorization/app password, not the website login password.
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${MAIL_STARTTLS_ENABLED:true}
      "[mail.smtp.starttls.required]": ${MAIL_STARTTLS_REQUIRED:true}
      "[mail.smtp.ssl.enable]": ${MAIL_SSL_ENABLED:false}
      # Port 465: ssl.enable=true; starttls.enable=false; starttls.required=false.

app:
  email-verification:
    enabled: ${EMAIL_VERIFICATION_ENABLED:false}
    from: ${MAIL_FROM:sender@example.com}
    # Use a random secret of at least 32 characters. Keep it identical across app instances.
    secret: ${EMAIL_VERIFICATION_SECRET:}
